name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node server/test.js
      - run: node src/chess/engineTest.js
      # Chunk pipeline (what the chunk workers run): bundled first because
      # plain Node can't import the JSON registries.
      - run: npx esbuild src/core/chunkTest.js --bundle --format=esm --outfile=.chunk-test.mjs
      - run: node .chunk-test.mjs
